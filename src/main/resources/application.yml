spring:
  application:
    name: backend

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

file:
  storage:
    upload-dir: ${FILE_STORAGE_UPLOAD_DIR:${user.dir}/uploads/files}

nts:
  business:
    enabled: ${NTS_BUSINESS_ENABLED:false}
    api-key: ${NTS_BUSINESS_API_KEY:}
    connect-timeout: ${NTS_BUSINESS_CONNECT_TIMEOUT:2s}
    response-timeout: ${NTS_BUSINESS_RESPONSE_TIMEOUT:8s}

server:
  servlet:
    context-path: /api

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
  default-flat-param-object: true


jwt:
  secret: ${JWT_SECRET:local-test-secret-key-1234567890}
  expiration: 1800000
  refresh-expiration: 604800000
